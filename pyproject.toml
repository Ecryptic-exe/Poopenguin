[project]
name = "chunithm-penguin-v2"
version = "2026.4"
description = "Privacy-focused CHUNITHM Penguin v2 Discord bot, reusing A, B and completed C capabilities"
authors = [{ name = "beerpsi", email = "beerpsi@duck.com" }]
dependencies = [
    "discord-py~=2.7",
    "pillow~=12.0",
    "alembic~=1.17.2",
    "aiosqlite~=0.22.0",
    "httpx~=0.28.1",
    "rapidfuzz~=3.14",
    "sqlalchemy[asyncio]~=2.0.46",
    "tzdata>=2024.2; sys_platform == 'win32'",
    "msgspec~=0.20.0",
    "structlog~=25.5",
    "async-lru~=2.0",
    "discord-ext-track-edits~=0.1.3",
    "hishel==0.1.3",
    "platformdirs~=4.5",
    "audioop-lts~=0.2.2; python_version >= '3.13'",
    "discord-ext-songbird~=0.2.0",
    "httpx-aiohttp",
    "python-magic~=0.4.27",
    "aiolimiter~=1.2",
    "selectolax>=0.4.7",
    "cryptography>=46,<49",
]
readme = "README.md"
requires-python = ">= 3.14"

[project.optional-dependencies]
rating = [
    "python-dotenv>=1,<2",
    "requests>=2.31,<3",
    "beautifulsoup4>=4.12,<5",
    "numpy>=1.24,<3",
    "matplotlib>=3.7,<4",
]
speedup = [
    "uvloop~=0.22.1; sys_platform != 'win32' and implementation_name == 'cpython'",
    "winloop~=0.4.1; sys_platform == 'win32' and implementation_name == 'cpython'",
    "aiodns~=3.6; sys_platform != 'win32'",
    # for when everything else gets freethreading
    # "ciso8601-ft~=2.3; python_version >= '3.14'",
    "ciso8601~=2.3",
    "penguin-native",
]
web = ["aiohttp-remotes~=1.3"]
jishaku = ["jishaku~=2.6", "pyotp~=2.9"]

[dependency-groups]
dev = [
    "ruff==0.13.3",
    "basedpyright==1.31.5",
    { include-group = "test" },
]
docs = [
    "mkdocs-material==9.6.21",
    "beautifulsoup4~=4.14",
]
test = [
    "pytest~=8.3",
    "pytest-asyncio~=0.24.0",
    "pytest-cov~=6.0",
    "pytest-httpx~=0.35.0",
    "pytest-html~=4.1",
    "pytest-benchmark>=5.2.3",
    "pytest-memray>=1.8.0; sys_platform != 'win32'",
]


[tool.uv]
managed = true
package = false
no-sources = false
# index-url = "https://mirrors.sustech.edu.cn/pypi/web/simple"

[tool.uv.pip]
universal = true
generate-hashes = true

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
discord-ext-songbird = { index = "discord-ext-songbird" }
penguin-native = { workspace = true }
httpx-aiohttp = { workspace = true }

[[tool.uv.index]]
name = "discord-ext-songbird"
url = "https://beer-psi.github.io/discord-ext-songbird"
explicit = true

[tool.ruff]
respect-gitignore = true

[tool.ruff.lint]
select = [
    "ASYNC",
    "B",
    "BLE",
    "C4",
    "DTZ",
    "E",
    "EM",
    "F",
    "FBT",
    "FLY",
    "I",
    "ISC",
    "Q",
    "PERF",
    "PGH",
    "PIE",
    "PTH",
    "RET",
    "RSE",
    "RUF",
    "SIM",
    "TRY",
    "TID252",
    "W",
]
ignore = ["E501"]
unfixable = ["B"]

[tool.ruff.lint.pycodestyle]
ignore-overlong-task-comments = true

[tool.ruff.lint.flake8-builtins]
builtins-ignorelist = ["id"]

[tool.ruff.lint.extend-per-file-ignores]
"__init__.py" = ["F401"]
"bot.py" = ["E402"]
"chunithm_net/consts.py" = ["RUF001"]
# Preserve Project C's Traditional Chinese UI text and punctuation.
"chuni_penguin/cogs/chunithm/rating_search.py" = ["RUF001"]
"chuni_penguin/cogs/chunithm/rating_analysis.py" = ["RUF001"]
"chuni_penguin/ui/rating_chart.py" = ["RUF001"]
# Preserve Project B's bilingual command messages.
"chuni_penguin/cogs/fun.py" = ["RUF001"]

[tool.basedpyright]
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "error",
    # discord.py 2.7.1 uses positional re.sub(count, flags); Python 3.14 deprecates it.
    "ignore:'count' is passed as positional argument:DeprecationWarning:discord.utils",
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning",
    "ignore:'asyncio.get_event_loop_policy' is deprecated:DeprecationWarning",
    "ignore:'asyncio.set_event_loop_policy' is deprecated:DeprecationWarning"
]
